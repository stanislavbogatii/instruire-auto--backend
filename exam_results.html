<!DOCTYPE html>
<html lang="ro">
<head>

    <title>Fișă de Examinare - Probă Teoretică</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        @page {
            size: A4;
            margin: 0;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }
        
        .form-container {
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto;
            padding: 15mm;
            background-color: white;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        
        h1 {
            text-align: center;
            font-size: 14pt;
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: bold;
        }
        
        .header-info {
            margin-bottom: 20px;
        }
        
        .field {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
        }
        
        .field label {
            font-weight: bold;
            margin-right: 10px;
            white-space: nowrap;
            font-size: 11pt;
        }
        
        .field-line {
            flex: 1;
            border-bottom: 1px solid #333;
            min-height: 20px;
        }
        
        .idnp-boxes {
            display: flex;
            gap: 3px;
        }
        
        .idnp-box {
            width: 22px;
            height: 28px;
            border: 1px solid #333;
            text-align: center;
            font-size: 12pt;
        }
        
        .answers-table {
            width: 100%;
            margin: 20px 0;
            border-collapse: collapse;
        }
        
        .answers-table td {
            border: 1px solid #333;
            padding: 6px 4px;
            text-align: center;
            font-size: 10pt;
            height: 30px;
        }
        
        .answers-table .row-label {
            font-weight: bold;
            background-color: #f0f0f0;
            width: 30px;
        }
        
        .answers-table .question-cell {
            width: calc((100% - 30px) / 24);
        }
        
        .footer {
            margin-top: 30px;
        }
        
        .signature-section {
            margin-top: 20px;
        }
        
        .note {
            text-align: center;
            font-size: 10pt;
            margin: 5px 0 15px 0;
            font-style: italic;
        }
        
        @media print {
            body {
                background-color: white;
                padding: 0;
            }
            
            .form-container {
                width: 210mm;
                height: 297mm;
                box-shadow: none;
                page-break-after: always;
            }
        }
        
        @media screen and (max-width: 800px) {
            body {
                padding: 10px;
            }
            
            .form-container {
                width: 100%;
                padding: 10mm;
            }
            
            .answers-table {
                font-size: 8pt;
            }
            
            .answers-table td {
                padding: 4px 2px;
            }
        }
    </style>
</head>
